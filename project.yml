name: TrasaGPS
options:
  bundleIdPrefix: sk.trasagps
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TrasaGPS:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - TrasaGPS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sk.trasagps.app
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TrasaGPS/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
